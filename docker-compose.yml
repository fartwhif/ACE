#version: '3'
services:

  ace-db:
    image: mysql:8.0
    container_name: ace-db
    env_file:
      - docker.env
    volumes:
      - ace-db-data:/var/lib/mysql
    ports:
      - "3306:3306/tcp"
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  ace-server:
    build: .
    image: acemulator/ace:latest
    depends_on:
      ace-db:
        condition: service_healthy
    container_name: ace-server
    env_file:
      - docker.env
    volumes:
      - ./Config:/ace/Config
      - ./Content:/ace/Content
      - ./Dats:/ace/Dats
      - ./Logs:/ace/Logs
      - ./Mods:/ace/Mods
      - ./Plugins:/ace/Plugins
    ports:
      - "9000-9001:9000-9001/udp"
      - "9002:9002/tcp"
    stdin_open: true
    #restart: unless-stopped
    restart: on-failure
volumes:

  ace-db-data:
